<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="760" viewBox="0 0 1800 760" role="img" aria-labelledby="title desc">
  <title id="title">OCI IAM App Gateway package flow</title>
  <desc id="desc">Flowchart showing the release platform ZIP creating the approved private OCIR image, the DevOps bootstrap ZIP creating each App Gateway deployment, and the pipeline source ZIP updating an existing deployment repository.</desc>

  <defs>
    <style>
      .sans { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; }
      .mono { font-family: Consolas, Menlo, monospace; letter-spacing: 0; }
      .title { font-size: 38px; font-weight: 700; fill: #1F2933; }
      .subtitle { font-size: 19px; fill: #52606D; }
      .lane { font-size: 15px; font-weight: 700; fill: #52606D; }
      .box-title { font-size: 22px; font-weight: 700; fill: #1F2933; }
      .zip { font-size: 16px; font-weight: 700; fill: #8E2F22; }
      .body { font-size: 16px; fill: #52606D; }
      .small { font-size: 14px; fill: #52606D; }
    </style>
  </defs>

  <rect width="1800" height="760" fill="#F7F8FA"/>
  <rect width="1800" height="9" fill="#C74634"/>
  <text class="sans title" x="70" y="67">OCI IAM App Gateway Package Flow</text>
  <text class="sans subtitle" x="70" y="101">Prepare the approved image once, deploy each environment, and update existing pipeline source only when required</text>

  <rect x="70" y="133" width="1660" height="34" rx="6" fill="#ECEFF2"/>
  <rect x="70" y="133" width="9" height="34" rx="4" fill="#C74634"/>
  <text class="sans lane" x="99" y="156">IMAGE PREPARATION — WHEN AN APPROVED VERSION IS NOT YET AVAILABLE</text>

  <rect x="90" y="195" width="480" height="130" rx="8" fill="#FDF3F1" stroke="#E4ACA4" stroke-width="2"/>
  <text class="sans box-title" x="330" y="229" text-anchor="middle">Release Platform Stack</text>
  <text class="mono zip" x="330" y="262" text-anchor="middle">oci-iam-appgateway-release-platform.zip</text>
  <text class="sans body" x="330" y="293" text-anchor="middle">Upload to OCI Resource Manager</text>

  <line x1="570" y1="260" x2="635" y2="260" stroke="#566573" stroke-width="3"/>
  <polygon points="635,250 650,260 635,270" fill="#566573"/>

  <rect x="670" y="195" width="420" height="130" rx="8" fill="#EAF3F7" stroke="#89AFC2" stroke-width="2"/>
  <text class="sans box-title" x="880" y="239" text-anchor="middle">Release DevOps Pipeline</text>
  <text class="sans body" x="880" y="274" text-anchor="middle">Download, validate, and publish</text>
  <text class="sans body" x="880" y="301" text-anchor="middle">the approved amd64 image</text>

  <line x1="1090" y1="260" x2="1155" y2="260" stroke="#566573" stroke-width="3"/>
  <polygon points="1155,250 1170,260 1155,270" fill="#566573"/>

  <rect x="1190" y="195" width="500" height="130" rx="8" fill="#EAF4EF" stroke="#91B49E" stroke-width="2"/>
  <text class="sans box-title" x="1440" y="239" text-anchor="middle">Private OCIR</text>
  <text class="sans body" x="1440" y="274" text-anchor="middle">Versioned App Gateway image</text>
  <text class="sans body" x="1440" y="301" text-anchor="middle">ready for deployment</text>

  <rect x="70" y="367" width="1660" height="34" rx="6" fill="#E8F2F5"/>
  <rect x="70" y="367" width="9" height="34" rx="4" fill="#2F6B8A"/>
  <text class="sans lane" x="99" y="390">APPLICATION DEPLOYMENT — ONCE FOR EACH ISOLATED ENVIRONMENT</text>

  <rect x="90" y="429" width="480" height="130" rx="8" fill="#FDF3F1" stroke="#E4ACA4" stroke-width="2"/>
  <text class="sans box-title" x="330" y="463" text-anchor="middle">Deployment Bootstrap</text>
  <text class="mono zip" x="330" y="496" text-anchor="middle">oci-iam-appgateway-devops-bootstrap.zip</text>
  <text class="sans body" x="330" y="527" text-anchor="middle">Run from OCI Cloud Shell</text>

  <line x1="570" y1="494" x2="635" y2="494" stroke="#566573" stroke-width="3"/>
  <polygon points="635,484 650,494 635,504" fill="#566573"/>

  <rect x="670" y="429" width="420" height="130" rx="8" fill="#EAF3F7" stroke="#89AFC2" stroke-width="2"/>
  <text class="sans box-title" x="880" y="473" text-anchor="middle">Deployment DevOps Pipeline</text>
  <text class="sans body" x="880" y="508" text-anchor="middle">Create IAM objects, wallet, TLS,</text>
  <text class="sans body" x="880" y="535" text-anchor="middle">networking, and runtime</text>

  <line x1="1090" y1="494" x2="1155" y2="494" stroke="#566573" stroke-width="3"/>
  <polygon points="1155,484 1170,494 1155,504" fill="#566573"/>

  <rect x="1190" y="429" width="500" height="130" rx="8" fill="#FFF5EC" stroke="#D9A06C" stroke-width="2"/>
  <text class="sans box-title" x="1440" y="473" text-anchor="middle">App Gateway Runtime</text>
  <text class="sans body" x="1440" y="508" text-anchor="middle">OCI Container Instance or Compute Instance</text>
  <text class="sans body" x="1440" y="535" text-anchor="middle">Sample header app or customer origin</text>

  <line x1="1440" y1="325" x2="1440" y2="414" stroke="#357A52" stroke-width="3"/>
  <polygon points="1430,414 1450,414 1440,429" fill="#357A52"/>
  <text class="sans small" x="1460" y="379">approved image</text>

  <rect x="385" y="617" width="740" height="90" rx="8" fill="#FAFBFC" stroke="#8A98A6" stroke-width="2" stroke-dasharray="8 7"/>
  <text class="sans box-title" x="755" y="649" text-anchor="middle">Existing Pipeline Maintenance</text>
  <text class="mono zip" x="755" y="680" text-anchor="middle">oci-iam-appgateway-deployment-pipeline-source.zip</text>
  <text class="sans small" x="755" y="700" text-anchor="middle">Publish reviewed code or configuration updates; do not use for a fresh deployment</text>

  <path d="M1125 662 L1160 662 L1160 494 L1105 494" fill="none" stroke="#8A98A6" stroke-width="2" stroke-dasharray="8 7"/>
  <polygon points="1105,484 1090,494 1105,504" fill="#8A98A6"/>
</svg>
