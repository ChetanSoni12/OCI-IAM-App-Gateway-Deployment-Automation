version: 0.1
component: build
timeoutInSeconds: 3300
shell: bash
failImmediatelyOnError: true
steps:
  - type: Command
    name: Deploy OCI IAM App Gateway
    command: |
      dnf -y install libaio openssl
      # OCI DevOps build runners use the Oracle Linux CA bundle. Export it so
      # Python's standard-library HTTPS client validates the IAM domain chain.
      for ca_bundle in /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem /etc/pki/tls/certs/ca-bundle.crt; do
        if [ -r "$ca_bundle" ]; then
          export SSL_CERT_FILE="$ca_bundle"
          break
        fi
      done
      test -n "${SSL_CERT_FILE:-}" -a -r "$SSL_CERT_FILE"
      python3 scripts/deploy.py
