# Edit these three application values for a custom application. Leave them unchanged
# to deploy the bundled Header Authentication Sample backend.
application_name=Header Authentication Sample
application_landing_url=https://appgateway.example.com:4443/
application_origin_url=http://127.0.0.1:8080/

# App Gateway TLS. "generated" creates a self-signed certificate in the selected
# Vault. For an existing certificate, use "vault" and provide PEM secret OCIDs.
appgateway_tls_mode=generated
appgateway_tls_cert_secret_ocid=
appgateway_tls_key_secret_ocid=
