server {
  listen 8080;
  default_type text/html;
  location / {
    return 200 '<!doctype html><html><head><title>Header Authentication Sample</title><style>body{font-family:Arial,sans-serif;margin:64px;color:#312d2a}main{max-width:700px;border-left:5px solid #c74634;padding:28px}h1{margin-top:0}code{display:block;background:#f6f4f2;padding:14px;overflow-wrap:anywhere}</style></head><body><main><h1>Header Authentication Sample</h1><p>Request reached the protected backend through OCI IAM App Gateway.</p><h2>Authenticated user header</h2><code>$http_x_authenticated_user</code></main></body></html>';
  }
}
